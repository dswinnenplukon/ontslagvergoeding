<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>HR Compensation Calculator</title>

<style>

body{
font-family:"Segoe UI",Arial,sans-serif;
background:linear-gradient(135deg,#e9eef6,#d8e1f0);
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.card{
width:520px;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

.header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.logo{
width:38px;
height:38px;
background:#2a6df4;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
}

h1{
font-size:22px;
margin:0;
}

.subtitle{
color:#666;
font-size:14px;
margin-bottom:20px;
}

label{
font-size:14px;
font-weight:600;
}

input,select{
width:100%;
padding:10px;
margin-top:6px;
margin-bottom:16px;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#2a6df4;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1f55c4;
}

.progress-container{
display:none;
margin-top:20px;
}

.progress-bar{
height:10px;
background:#e6e6e6;
border-radius:10px;
overflow:hidden;
}

.progress{
height:100%;
width:0%;
background:#2a6df4;
transition:width .6s;
}

.status{
margin-top:10px;
font-size:13px;
color:#555;
}

.chart{
height:120px;
background:linear-gradient(to top,#2a6df4 0%,#2a6df4 5%,transparent 5%);
border-radius:6px;
margin-top:20px;
display:none;
}

.result{
margin-top:20px;
padding:18px;
background:#f3f6fb;
border-radius:8px;
text-align:center;
display:none;
}

.amount{
font-size:32px;
font-weight:bold;
margin-top:6px;
}

.details{
font-size:13px;
color:#555;
margin-top:10px;
}

.footer{
margin-top:20px;
font-size:11px;
color:#888;
text-align:center;
}

</style>
</head>

<body>

<div class="card">

<div class="header">
<div class="logo">HR</div>
<h1>Compensation Calculator</h1>
</div>

<div class="subtitle">
Bereken een indicatie van uw wettelijke ontslagvergoeding.
</div>

<label>Bruto maandsalaris (€)</label>
<input type="number">

<label>Aantal dienstjaren</label>
<input type="number">

<label>Leeftijd</label>
<input type="number">

<label>Type contract</label>
<select>
<option>Onbepaalde tijd</option>
<option>Tijdelijk contract</option>
<option>Proeftijd</option>
</select>

<button onclick="start()">Start berekening</button>

<div class="progress-container" id="progressBox">

<div class="progress-bar">
<div class="progress" id="progress"></div>
</div>

<div class="status" id="status">
Analyse starten...
</div>

</div>

<div class="chart" id="chart"></div>

<div class="result" id="result">

Geschatte ontslagvergoeding

<div class="amount">€0</div>

<div class="details">
Analyse voltooid • Wettelijke vergoeding berekend
</div>

</div>

<div class="footer">
Indicatieve berekening – hier kunnen geen rechten aan worden ontleend.
</div>

</div>

<script>

const stappen=[
"Arbeidscontract analyseren...",
"Dienstjaren berekenen...",
"Salarisstructuur analyseren...",
"Wettelijke transitievergoeding berekenen...",
"Sectorregeling controleren...",
"Belastingcomponent simuleren...",
"Resultaat genereren..."
];

let stap=0;

function start(){

document.getElementById("progressBox").style.display="block";
document.getElementById("result").style.display="none";
document.getElementById("chart").style.display="none";

stap=0;

nextStep();

}

function nextStep(){

let progress=document.getElementById("progress");
let status=document.getElementById("status");

status.innerText=stappen[stap];

progress.style.width=((stap+1)/stappen.length*100)+"%";

stap++;

if(stap<stappen.length){

setTimeout(nextStep,900);

}else{

setTimeout(function(){

document.getElementById("chart").style.display="block";

setTimeout(function(){

document.getElementById("result").style.display="block";

},1000);

},800);

}

}

</script>

</body>
</html>
