<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Ontslagvergoeding Calculator</title>

<style>
body{
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg,#eef2f7,#dfe6f0);
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
}

.card{
    background:white;
    width:420px;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

h1{
    margin-top:0;
    font-size:22px;
}

.subtitle{
    color:#666;
    font-size:14px;
    margin-bottom:20px;
}

label{
    font-size:14px;
    font-weight:600;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:6px;
    margin-bottom:16px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2a6df4;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#1f55c4;
}

.result{
    margin-top:25px;
    padding:15px;
    border-radius:6px;
    background:#f3f6fb;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.loading{
    text-align:center;
    margin-top:20px;
    display:none;
}

.spinner{
    border:4px solid #eee;
    border-top:4px solid #2a6df4;
    border-radius:50%;
    width:30px;
    height:30px;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
}

.footer{
    margin-top:15px;
    font-size:11px;
    color:#888;
    text-align:center;
}
</style>
</head>

<body>

<div class="card">

<h1>Ontslagvergoeding Calculator</h1>
<div class="subtitle">Bereken een indicatie van uw wettelijke ontslagvergoeding.</div>

<label>Bruto maandsalaris (€)</label>
<input type="number" id="salary" placeholder="Bijv. 3200">

<label>Aantal dienstjaren</label>
<input type="number" id="years" placeholder="Bijv. 5">

<label>Leeftijd</label>
<input type="number" id="age" placeholder="Bijv. 38">

<label>Type contract</label>
<select id="contract">
<option>Onbepaalde tijd</option>
<option>Tijdelijk contract</option>
<option>Proeftijd</option>
</select>

<button onclick="bereken()">Bereken ontslagvergoeding</button>

<div class="loading" id="loading">
<div class="spinner"></div>
<div>Berekening uitvoeren...</div>
</div>

<div class="result" id="result" style="display:none;"></div>

<div class="footer">
Indicatieve berekening – hier kunnen geen rechten aan worden ontleend.
</div>

</div>

<script>

function bereken(){

document.getElementById("result").style.display="none";
document.getElementById("loading").style.display="block";

setTimeout(function(){

document.getElementById("loading").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML="Uw geschatte ontslagvergoeding:<br><span style='font-size:26px'>€0</span>";

},2000);

}

</script>

</body>
</html>
