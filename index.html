<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Ontslagvergoeding Calculator</title>

<style>

body{
font-family:"Segoe UI",Arial,sans-serif;
background:linear-gradient(135deg,#e9eef6,#d8e1f0);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
}

.card{
background:white;
width:460px;
padding:35px;
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

h1{
margin-top:0;
font-size:22px;
}

.subtitle{
color:#666;
font-size:14px;
margin-bottom:20px;
}

label{
font-size:14px;
font-weight:600;
}

input,select{
width:100%;
padding:10px;
margin-top:6px;
margin-bottom:16px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

button{
width:100%;
padding:12px;
border:none;
background:#2a6df4;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1f55c4;
}

.progress-container{
margin-top:20px;
display:none;
}

.progress-bar{
height:10px;
background:#e5e5e5;
border-radius:10px;
overflow:hidden;
}

.progress{
height:100%;
width:0%;
background:#2a6df4;
transition:width 0.5s;
}

.status{
font-size:13px;
margin-top:10px;
color:#555;
}

.result{
margin-top:25px;
padding:18px;
border-radius:8px;
background:#f3f6fb;
text-align:center;
display:none;
}

.amount{
font-size:30px;
font-weight:bold;
margin-top:8px;
}

.footer{
margin-top:18px;
font-size:11px;
color:#888;
text-align:center;
}

</style>
</head>

<body>

<div class="card">

<h1>Ontslagvergoeding Calculator</h1>
<div class="subtitle">Bereken een indicatie van uw wettelijke ontslagvergoeding.</div>

<label>Bruto maandsalaris (€)</label>
<input type="number" id="salary">

<label>Aantal dienstjaren</label>
<input type="number" id="years">

<label>Leeftijd</label>
<input type="number" id="age">

<label>Type contract</label>
<select>
<option>Onbepaalde tijd</option>
<option>Tijdelijk contract</option>
<option>Proeftijd</option>
</select>

<button onclick="startBerekening()">Bereken ontslagvergoeding</button>

<div class="progress-container" id="progressContainer">

<div class="progress-bar">
<div class="progress" id="progress"></div>
</div>

<div class="status" id="status">
Analyse starten...
</div>

</div>

<div class="result" id="result">

Geschatte ontslagvergoeding

<div class="amount">€0</div>

</div>

<div class="footer">
Indicatieve berekening – hier kunnen geen rechten aan worden ontleend.
</div>

</div>

<script>

const stappen = [
"Arbeidscontract analyseren...",
"Dienstjaren berekenen...",
"Salariscomponenten verwerken...",
"Wettelijke transitievergoeding berekenen...",
"Regionale regelgeving controleren...",
"Resultaat genereren..."
];

let stap = 0;

function startBerekening(){

document.getElementById("progressContainer").style.display="block";
document.getElementById("result").style.display="none";

stap = 0;

updateStap();

}

function updateStap(){

let progress = document.getElementById("progress");
let status = document.getElementById("status");

status.innerText = stappen[stap];

progress.style.width = ((stap+1)/stappen.length*100)+"%";

stap++;

if(stap < stappen.length){

setTimeout(updateStap,900);

}else{

setTimeout(function(){

document.getElementById("result").style.display="block";

},800);

}

}

</script>

</body>
</html>
